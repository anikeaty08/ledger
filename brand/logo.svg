<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none">
  <!-- Full lockup: mark + wordmark + a closing double-rule underline (the same motif used to mark a
       Settled invoice), tying the logo directly to the product's own status language. -->
  <rect x="0" y="4" width="48" height="48" rx="7" fill="#EDF2EA"/>
  <path d="M12 27 L20.5 35.5 L37 15" stroke="#8B2E23" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>

  <text x="60" y="34" font-family="'IBM Plex Sans', 'Public Sans', 'Segoe UI', Arial, sans-serif"
        font-weight="600" font-size="26" letter-spacing="-0.3" fill="#221F1A">Ledger</text>

  <line x1="60" y1="43" x2="216" y2="43" stroke="#A8B5A0" stroke-width="1.5"/>
  <line x1="60" y1="47" x2="216" y2="47" stroke="#A8B5A0" stroke-width="1.5"/>
</svg>
